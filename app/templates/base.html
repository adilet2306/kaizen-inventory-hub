<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kaizen Inventory Hub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div>
      <a class="brand" href="/">Kaizen Inventory Hub</a>
      <span class="tagline">Inventory, orders, and low-stock visibility</span>
    </div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/products">Products</a>
      <a href="/orders">Orders</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Kaizen Inventory Hub v1.0.0</span>
    <a href="/health">Health</a>
    <a href="/ready">Ready</a>
    <a href="/metrics">Metrics</a>
  </footer>
</body>
</html>
